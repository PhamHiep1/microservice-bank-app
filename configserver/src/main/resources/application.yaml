spring:
  application:
    name: configserver
  profiles:
    active: git
  cloud:
    config:
      server:
#        native:
#          search-locations: classpath:/config
        git:
          uri: https://github.com/PhamHiep1/microservice-bank-app-config.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest



management:
  endpoints:
    web:
      exposure:
        include: "*"

  # Nhóm 1: Bật các chỉ số Liveness và Readiness Probe của Spring Boot
  endpoint:
    health:
      probes:
        enabled: true

  # Nhóm 2: Cấu hình chi tiết hiển thị trạng thái (Health Group)
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true



