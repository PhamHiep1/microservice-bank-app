api:
  prefix: "/api"
server:
  port: 9000
spring:
  application:
    name: card
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3308/cardDB
    username: root
    password: root
    sql:
      init:
        mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        id:
          db_structure_naming_strategy: legacy
  config:
    import: "optional:configserver:http://localhost:8071"
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
