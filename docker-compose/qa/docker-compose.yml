services:
  rabbit:
    image: "rabbitmq:4-management"
    container_name: "rabbitmq-broker"
    hostname: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # Lệnh kiểm tra sức khỏe
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service


  configserver:
    image: "phamhiep1/configserver:v2"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      # Gọi endpoint Readiness của Actuator và dùng grep lọc chữ "UP"
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config


  account:
    image: "phamhiep1/account:v2"
    container_name: account-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy # Chỉ chạy khi Config Server đã trả về trạng thái UP
    environment:
      SPRING_APPLICATION_NAME: "account"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8071/"
    extends:
      file: common-config.yml
      service: microservice-base-config

  loan:
    image: "phamhiep1/loan:v2"
    container_name: loan-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loan"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8071/"
    extends:
      file: common-config.yml
      service: microservice-base-config

  card:
    image: "phamhiep1/card:v2"
    container_name: card-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "card"
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8071/"
    extends:
      file: common-config.yml
      service: microservice-base-config

networks:
  bank:
    driver: "bridge"