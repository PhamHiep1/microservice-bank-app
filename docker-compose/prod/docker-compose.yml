  #      - "15672:15672"
  #    healthcheck:
  #      # Lệnh kiểm tra sức khỏe
  #      test: rabbitmq-diagnostics check_port_connectivity
  #      interval: 10s
  #      timeout: 5s
  #      retries: 10
