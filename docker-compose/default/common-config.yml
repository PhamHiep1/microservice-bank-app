services:
  network-deploy-service:
    networks:
      - bank

  microservice-db-config:
    extends:
      service: network-deploy-service
    image: mysql:8.4.9
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
      interval: 15s
      start_period: 240s
    environment:
      MYSQL_ROOT_PASSWORD: root

  microservice-base-config:
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 700m
